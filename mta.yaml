_schema-version: '3.2'
ID: apl-gate-app
version: 1.0.0
description: "Factory Gate Operations & Logistics Management - SAP BTP Production MTA"
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npm run build

modules:
  # ------------------------------------------------------------
  # 1. CAP Node.js Backend Service
  # ------------------------------------------------------------
  - name: apl-gate-app-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
      memory: 512M
      disk-quota: 1024M
    properties:
      NODE_ENV: production
      CDS_ENV: production
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: apl-gate-app-auth
      - name: apl-gate-app-destination
      - name: apl-gate-app-connectivity

  # ------------------------------------------------------------
  # 2. Enterprise Approuter (Authentication & Ingress Proxy)
  # ------------------------------------------------------------
  - name: apl-gate-app-router
    type: approuter.nodejs
    path: approuter
    parameters:
      keep-existing-routes: true
      instances: 1
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: apl-gate-app-auth
      - name: apl-gate-app-destination
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  # ------------------------------------------------------------
  # A. SAP BTP XSUAA Service (Identity & RBAC Authorization)
  # ------------------------------------------------------------
  - name: apl-gate-app-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: apl-gate-app-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api

  # ------------------------------------------------------------
  # B. SAP BTP Destination Service (S/4HANA PO Integration)
  # ------------------------------------------------------------
  - name: apl-gate-app-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: apl-gate-app-srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                ProxyType: Internet
                Type: HTTP
    requires:
      - name: srv-api

  # ------------------------------------------------------------
  # C. SAP BTP Connectivity Service (Cloud & On-Premises Connector)
  # ------------------------------------------------------------
  - name: apl-gate-app-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite